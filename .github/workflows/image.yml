name: Container image

# Called by a release. Builds the image on each kind of computer it is offered for, tries each
# build as a container, and publishes them to the GitHub registry under the release's version.
# The registry accepts the workflow's own token, so there is no password or key to store.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and try on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # To push this build to the registry.
    strategy:
      # Half an image is never published: if one build fails, nothing gets the version's names.
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Name the image after the repository and the version in package.json
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build the image
        # Provenance is recorded once, for the published image, by the last job.
        run: |
          docker build --provenance=false \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "${IMAGE}:${VERSION}-${PLATFORM}" .
      - name: Start a container and use it
        run: SMOKE_IMAGE="${IMAGE}:${VERSION}-${PLATFORM}" npm run smoke
      - name: Push this build
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${VERSION}-${PLATFORM}"

  publish:
    name: Publish under the version's names
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # To give the builds their names in the registry.
      id-token: write # To sign the record of where the image was built.
      attestations: write # To store that record.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Name the image after the repository and the version in package.json
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Join the builds under the version, its shorter forms and latest
        env:
          TOKEN: ${{ github.token }}
        # 1.2.3 is also published as 1.2 and 1, so that a library can follow fixes by itself.
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${VERSION%.*}" --tag "${IMAGE}:${VERSION%%.*}" --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          echo "DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_ENV"
      - name: Record where the image was built
        # Anyone can then check that an image came from this repository's release workflow.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # Storage records exist only for repositories owned by an organisation.
          create-storage-record: false
